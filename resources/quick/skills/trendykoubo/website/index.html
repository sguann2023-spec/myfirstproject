<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>网感口播</title>
  <style>
    :root {
      color-scheme: light;
      --page-max-width: 430px;
      --dark-bg: #000000;
      --dark-card: #111526;
      --light-bg: #000000;
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.68);
      --white: #ffffff;
      --brand: #a81c23;
      --brand-soft: rgba(168, 28, 35, 0.12);
      --brand-shadow: rgba(168, 28, 35, 0.28);
      --border: rgba(17, 24, 39, 0.08);
      --chip-bg: #ffffff;
      --chip-border: rgba(168, 28, 35, 0.18);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
        "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--light-bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .page {
      width: 100%;
      max-width: var(--page-max-width);
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 32px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 4px 8px;
    }

    .header-logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #a81c23 0%, #d4363b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #fff;
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 4px 16px var(--brand-shadow);
    }

    .header-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }

    .header-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* Card */
    .card {
      background: var(--dark-card);
      border-radius: var(--radius-lg);
      padding: 16px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0 0 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-title-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .card-hint {
      font-size: 12px;
      color: var(--text-secondary);
      margin: 0 0 12px;
      line-height: 1.5;
    }

    /* Drop zone */
    .drop-zone {
      position: relative;
      border: 2px dashed rgba(168, 28, 35, 0.3);
      border-radius: var(--radius-md);
      padding: 28px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: rgba(168, 28, 35, 0.04);
    }

    .drop-zone:hover,
    .drop-zone.drag-over {
      border-color: var(--brand);
      background: var(--brand-soft);
    }

    .drop-zone.has-file {
      border-style: solid;
      border-color: var(--brand);
      padding: 12px;
    }

    .drop-zone-icon {
      font-size: 32px;
      opacity: 0.6;
    }

    .drop-zone-text {
      font-size: 14px;
      color: var(--text-secondary);
      text-align: center;
    }

    .drop-zone-text strong {
      color: var(--brand);
      font-weight: 600;
    }

    .drop-zone input[type="file"] {
      display: none;
    }

    /* File item */
    .file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: var(--radius-sm);
    }

    .file-item-thumb {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .file-item-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .file-item-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .file-item-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-item-size {
      font-size: 12px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .file-item-remove {
      width: 28px;
      height: 28px;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .file-item-remove:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    /* Preview */
    .preview-container {
      margin-top: 12px;
      position: relative;
      aspect-ratio: 9 / 16;
      max-height: 280px;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.04);
    }

    .preview-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.6);
      font-size: 11px;
      color: #fff;
      backdrop-filter: blur(8px);
    }

    /* Textarea */
    .textarea-wrap {
      position: relative;
    }

    .textarea-wrap textarea {
      width: 100%;
      min-height: 80px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    .textarea-wrap textarea::placeholder {
      color: var(--text-secondary);
      opacity: 0.6;
    }

    .textarea-wrap textarea:focus {
      border-color: var(--brand);
    }

    /* Input */
    .input-wrap {
      position: relative;
    }

    .input-wrap input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    .input-wrap input::placeholder {
      color: var(--text-secondary);
      opacity: 0.6;
    }

    .input-wrap input:focus {
      border-color: var(--brand);
    }

    /* URL input */
    .url-input-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .url-input-row input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    .url-input-row input::placeholder {
      color: var(--text-secondary);
      opacity: 0.5;
    }

    .url-input-row input:focus {
      border-color: var(--brand);
    }

    .url-add-btn {
      padding: 0 14px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--brand);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }

    .url-add-btn:hover {
      opacity: 0.85;
    }

    .url-add-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Generate button */
    .generate-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #a81c23 0%, #d4363b 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.15s, transform 0.1s;
      box-shadow: 0 4px 20px var(--brand-shadow);
    }

    .generate-btn:hover {
      opacity: 0.92;
    }

    .generate-btn:active {
      transform: scale(0.98);
    }

    .generate-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      z-index: 1000;
      max-width: 320px;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.success {
      background: rgba(34, 197, 94, 0.95);
      color: #fff;
    }

    .toast.error {
      background: rgba(239, 68, 68, 0.95);
      color: #fff;
    }

    .toast.info {
      background: rgba(168, 28, 35, 0.95);
      color: #fff;
    }

    /* URL list */
    .url-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .url-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .url-item-text {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: "SF Mono", "Fira Code", monospace;
    }

    .url-item-remove {
      width: 22px;
      height: 22px;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .url-item-remove:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    /* Divider */
    .divider-or {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .divider-or::before,
    .divider-or::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- Header -->
    <div class="header">
      <div class="header-logo">播</div>
      <div class="header-text">
        <div class="header-title">网感口播</div>
        <div class="header-subtitle">高级红双行标题 · 双语字幕 · 关键词弹出</div>
      </div>
    </div>

    <!-- Koubo video -->
    <div class="card">
      <p class="card-title">
        <span class="card-title-icon">🎬</span>
        口播视频
      </p>
      <p class="card-hint">上传本地视频或粘贴公网 URL，仅支持一个视频</p>

      <div class="drop-zone" id="kouboDropZone">
        <input type="file" id="kouboFileInput" accept="video/*">
        <div class="drop-zone-icon">📤</div>
        <div class="drop-zone-text">
          点击选择或拖拽<strong>口播视频</strong>到此处
        </div>
      </div>

      <div class="divider-or">或粘贴视频链接</div>

      <div class="url-input-row">
        <input type="url" id="kouboUrlInput" placeholder="https://example.com/video.mp4">
        <button class="url-add-btn" id="kouboUrlAddBtn">添加</button>
      </div>

      <div id="kouboPreviewArea" hidden></div>
    </div>

    <!-- Optional text correction -->
    <div class="card">
      <p class="card-title">
        <span class="card-title-icon">✏️</span>
        校正文案
        <span style="font-weight:400;font-size:12px;color:var(--text-secondary)">（可选）</span>
      </p>
      <p class="card-hint">粘贴口播文案可提升 ASR 识别准确度，留空则自动识别</p>
      <div class="textarea-wrap">
        <textarea id="textContent" placeholder="在此粘贴口播文案原文…"></textarea>
      </div>
    </div>

    <!-- Generate button -->
    <button class="generate-btn" id="generateBtn" disabled>
      请上传口播视频
    </button>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // === State ===
    const state = {
      kouboFile: null,
      kouboUrl: null,
      previewUrl: null
    };

    // === DOM refs ===
    const kouboDropZone = document.getElementById('kouboDropZone');
    const kouboFileInput = document.getElementById('kouboFileInput');
    const kouboUrlInput = document.getElementById('kouboUrlInput');
    const kouboUrlAddBtn = document.getElementById('kouboUrlAddBtn');
    const kouboPreviewArea = document.getElementById('kouboPreviewArea');
    const textContent = document.getElementById('textContent');
    const generateBtn = document.getElementById('generateBtn');
    const toastEl = document.getElementById('toast');

    // === Toast ===
    let toastTimer = null;
    function showToast(message, type = 'info') {
      clearTimeout(toastTimer);
      toastEl.textContent = message;
      toastEl.className = `toast ${type}`;
      requestAnimationFrame(() => toastEl.classList.add('show'));
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2500);
    }

    // === File helpers ===
    function formatFileSize(bytes) {
      if (!bytes || bytes <= 0) return '';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function getMaterialPath(file) {
      if (!file) return '';
      if (file.path) return String(file.path).trim();
      if (file.url) return String(file.url).trim();
      return '';
    }

    function normalizeHostFile(item) {
      const rawType = String(item?.type || '').trim();
      let mime = rawType;
      if (rawType === 'video' || rawType === 'video/*') {
        mime = 'video/*';
      } else if (rawType === 'audio' || rawType === 'audio/*') {
        mime = 'audio/*';
      }
      return {
        name: String(item?.name || '本地文件'),
        size: Number(item?.size || 0),
        type: mime,
        lastModified: Number(item?.lastModified || 0),
        path: String(item?.path || '').trim()
      };
    }

    async function pickFilesViaHost(options) {
      const { multiple, accept } = options || {};
      if (typeof globalThis.selectLocalFilesFromHost !== 'function') {
        return null;
      }
      try {
        const selectedFiles = await globalThis.selectLocalFilesFromHost({
          properties: multiple ? ['openFile', 'multiSelections'] : ['openFile'],
          filters: [{ name: '视频', extensions: ['mp4', 'mov', 'm4v', 'avi', 'mkv', 'webm'] }]
        });
        if (!Array.isArray(selectedFiles)) return null;
        return selectedFiles.map(normalizeHostFile);
      } catch (error) {
        return null;
      }
    }

    function getLocalFilePreviewUrl(path) {
      const slashNormalizedPath = String(path || '').trim().replace(/\\/g, '/');
      const fileUrlPath = slashNormalizedPath.startsWith('/') ? slashNormalizedPath : `/${slashNormalizedPath}`;
      return encodeURI(`file://${fileUrlPath}`);
    }

    // === Koubo video handling ===
    function revokeKouboPreview() {
      if (state.previewUrl) {
        URL.revokeObjectURL(state.previewUrl);
        state.previewUrl = null;
      }
    }

    function setKouboFile(file) {
      revokeKouboPreview();
      state.kouboFile = file;
      state.kouboUrl = null;
      kouboUrlInput.value = '';
      updateKouboUI();
      updateGenerateBtn();
    }

    function setKouboUrl(url) {
      revokeKouboPreview();
      state.kouboUrl = url.trim();
      state.kouboFile = null;
      kouboFileInput.value = '';
      updateKouboUI();
      updateGenerateBtn();
    }

    function clearKoubo() {
      revokeKouboPreview();
      state.kouboFile = null;
      state.kouboUrl = null;
      kouboFileInput.value = '';
      kouboUrlInput.value = '';
      updateKouboUI();
      updateGenerateBtn();
    }

    function updateKouboUI() {
      kouboDropZone.classList.remove('has-file');
      kouboPreviewArea.hidden = true;
      kouboPreviewArea.innerHTML = '';

      if (state.kouboFile) {
        const filePath = getMaterialPath(state.kouboFile);
        const previewUrl = filePath ? getLocalFilePreviewUrl(filePath) : null;

        kouboDropZone.classList.add('has-file');
        kouboDropZone.innerHTML = `
          <div class="file-item">
            <div class="file-item-thumb">
              ${previewUrl ? `<video src="${previewUrl}" muted></video>` : '🎬'}
            </div>
            <div class="file-item-info">
              <div class="file-item-name">${escapeHtml(state.kouboFile.name)}</div>
              <div class="file-item-size">${formatFileSize(state.kouboFile.size)}</div>
            </div>
            <button class="file-item-remove" id="kouboRemoveBtn" title="移除">✕</button>
          </div>
        `;
        document.getElementById('kouboRemoveBtn').addEventListener('click', (e) => {
          e.stopPropagation();
          clearKoubo();
        });

        if (previewUrl) {
          state.previewUrl = previewUrl;
          kouboPreviewArea.hidden = false;
          kouboPreviewArea.innerHTML = `
            <div class="preview-container">
              <video src="${previewUrl}" controls muted playsinline></video>
              <div class="preview-badge">口播视频</div>
            </div>
          `;
        }
      } else if (state.kouboUrl) {
        kouboDropZone.classList.add('has-file');
        kouboDropZone.innerHTML = `
          <div class="file-item">
            <div class="file-item-thumb">🎬</div>
            <div class="file-item-info">
              <div class="file-item-name">${escapeHtml(state.kouboUrl)}</div>
              <div class="file-item-size">公网链接</div>
            </div>
            <button class="file-item-remove" id="kouboRemoveBtn" title="移除">✕</button>
          </div>
        `;
        document.getElementById('kouboRemoveBtn').addEventListener('click', (e) => {
          e.stopPropagation();
          clearKoubo();
        });

        kouboPreviewArea.hidden = false;
        kouboPreviewArea.innerHTML = `
          <div class="preview-container">
            <video src="${escapeHtml(state.kouboUrl)}" controls muted playsinline crossorigin="anonymous"></video>
            <div class="preview-badge">口播视频</div>
          </div>
        `;
      } else {
        kouboDropZone.innerHTML = `
          <input type="file" id="kouboFileInput" accept="video/*">
          <div class="drop-zone-icon">📤</div>
          <div class="drop-zone-text">
            点击选择或拖拽<strong>口播视频</strong>到此处
          </div>
        `;
        const newInput = document.getElementById('kouboFileInput');
        newInput.addEventListener('change', handleKouboFileSelect);
        setupKouboDropZone();
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // === File drop ===
    function setupKouboDropZone() {
      const dropZone = kouboDropZone;

      dropZone.addEventListener('click', async () => {
        const hostFiles = await pickFilesViaHost({ multiple: false, accept: 'video/*' });
        if (hostFiles !== null) {
          if (hostFiles.length) setKouboFile(hostFiles[0]);
          return;
        }
        const input = dropZone.querySelector('input[type="file"]');
        if (input) input.click();
      });

      const input = dropZone.querySelector('input[type="file"]');
      if (input) {
        input.addEventListener('change', handleKouboFileSelect);
      }

      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
      });

      dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('drag-over');
      });

      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        const files = e.dataTransfer?.files;
        if (files && files.length) {
          const videoFile = Array.from(files).find(f => f.type.startsWith('video/'));
          if (videoFile) {
            setKouboFile({
              name: videoFile.name,
              size: videoFile.size,
              type: videoFile.type,
              path: '',
              lastModified: videoFile.lastModified
            });
            showToast('已选择口播视频', 'success');
          } else {
            showToast('请选择视频文件', 'error');
          }
        }
      });
    }

    function handleKouboFileSelect(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      if (!file.type.startsWith('video/')) {
        showToast('请选择视频文件', 'error');
        return;
      }
      setKouboFile({
        name: file.name,
        size: file.size,
        type: file.type,
        path: '',
        lastModified: file.lastModified
      });
      showToast('已选择口播视频', 'success');
    }

    // === URL add ===
    kouboUrlAddBtn.addEventListener('click', () => {
      const url = kouboUrlInput.value.trim();
      if (!url) {
        showToast('请输入视频链接', 'error');
        return;
      }
      try {
        new URL(url);
      } catch {
        showToast('链接格式不正确', 'error');
        return;
      }
      setKouboUrl(url);
      showToast('已添加视频链接', 'success');
    });

    kouboUrlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        kouboUrlAddBtn.click();
      }
    });

    // === Generate button ===
    function updateGenerateBtn() {
      const hasKoubo = state.kouboFile || state.kouboUrl;
      generateBtn.disabled = !hasKoubo;
      generateBtn.textContent = hasKoubo ? '开始生成' : '请上传口播视频';
    }

    // === Build prompt ===
    function buildPrompt(kouboFile, textContent) {
      const videoPath = kouboFile ? getMaterialPath(kouboFile) : '';
      const videoSource = videoPath || state.kouboUrl || '';

      if (!videoSource) {
        return null;
      }

      let prompt = `@网感口播 ${videoSource}`;

      const corrections = (textContent || '').trim();

      if (corrections) {
        prompt += `\n校正文案：${corrections}`;
      }

      return prompt;
    }

    // === Send to host ===
    function sendPromptToHost(prompt) {
      const normalizedText = String(prompt || '').trim();
      if (!normalizedText) return false;

      if (typeof globalThis.sendTextToMainWindow === 'function') {
        try {
          void globalThis.sendTextToMainWindow(normalizedText);
          return true;
        } catch (error) {
          showToast('无法与宿主通信', 'error');
          return false;
        }
      }
      showToast('请在 VectCut 客户端中打开本页面', 'error');
      return false;
    }

    // === Generate click ===
    generateBtn.addEventListener('click', () => {
      if (!state.kouboFile && !state.kouboUrl) {
        showToast('请先上传口播视频', 'error');
        return;
      }

      const prompt = buildPrompt(state.kouboFile, textContent.value);
      if (!prompt) {
        showToast('缺少口播视频', 'error');
        return;
      }

      try {
        const success = sendPromptToHost(prompt);
        if (!success) {
          showToast('无法发送到宿主', 'error');
          return;
        }
        showToast('已发送生成指令', 'success');
      } catch (error) {
        showToast('生成失败，请重试', 'error');
      }
    });

    // === Init ===
    setupKouboDropZone();
    updateGenerateBtn();

    // === Cleanup ===
    window.addEventListener('beforeunload', () => {
      revokeKouboPreview();
    });
  </script>
</body>
</html>
