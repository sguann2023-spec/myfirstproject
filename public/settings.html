<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>设置</title> <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval';">
  <link rel="stylesheet">
  <style>
    /* 设置页的自定义窗口按钮样式（Windows 风格：最小化/最大化/关闭） */
    .win-caption-controls {
      position: fixed;
      top: 0;
      right: 0;
      display: flex;
      align-items: stretch;
      z-index: 2000;
      -webkit-app-region: no-drag;
    }
    .win-caption-btn {
      width: 46px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      outline: none;
      padding: 0;
      background-color: transparent;
      color: #1f1f1f;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }
    .win-caption-btn:hover { background-color: rgba(0, 0, 0, 0.08); }
    .win-caption-btn:active { background-color: rgba(0, 0, 0, 0.12); }
    .win-caption-btn--close:hover,
    .win-caption-btn--close:active { background-color: #e81123; color: #ffffff; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script defer src="settings.bundle.js"></script> 

  <!-- Windows 自定义窗口控制按钮 -->
  <div class="win-caption-controls">
    <button class="win-caption-btn minimize" title="最小化">
      <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="0" y="4.5" width="10" height="1" fill="currentColor"/></svg>
    </button>
    <button class="win-caption-btn maximize" title="最大化/还原">
      <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>
    </button>
    <button class="win-caption-btn win-caption-btn--close close" title="关闭">
      <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0.5 0.5 L9.5 9.5 M9.5 0.5 L0.5 9.5" stroke="currentColor" stroke-width="1" fill="none"/></svg>
    </button>
  </div>

  <script>
    // 仅在 Windows 显示（避免干扰 macOS）
    const isWindows = typeof process !== 'undefined' && process.platform === 'win32';
    if (!isWindows) {
      document.querySelector('.win-caption-controls').style.display = 'none';
    } else {
      const { ipcRenderer } = window.require('electron');
      document.querySelector('.win-caption-btn.minimize').addEventListener('click', () => {
        ipcRenderer.send('window-controls', 'minimize');
      });
      document.querySelector('.win-caption-btn.maximize').addEventListener('click', () => {
        ipcRenderer.send('window-controls', 'maximize');
      });
      document.querySelector('.win-caption-btn.win-caption-btn--close').addEventListener('click', () => {
        ipcRenderer.send('window-controls', 'close');
      });
    }
  </script>
</body>
</html>
