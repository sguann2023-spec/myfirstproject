name: Dev Build and Deploy to OSS

on:
  push:
    branches:
      - test_oss # 仅在推送到 test_oss 分支时触发

# 权限设置，确保可以读取代码并访问 Secret
permissions:
  contents: read
  id-token: write # 如果使用 OIDC 认证，则需要此权限

jobs:
  upload-test-file:
    runs-on: ubuntu-latest
    steps:
      - name: Create test file
        run: |
          TS=$(date +%Y%m%d%H%M%S)
          echo "oss upload test: ${TS}" > /tmp/oss-upload-test.txt
          echo "repo=${GITHUB_REPOSITORY}" >> /tmp/oss-upload-test.txt
          echo "sha=${GITHUB_SHA}" >> /tmp/oss-upload-test.txt

      - name: Upload test file to OSS
        uses: aliyun/ossutil-action@v1.1
        with:
          endpoint: ${{ secrets.MP4_OSS_ENDPOINT }}
          access-key-id: ${{ secrets.MP4_OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.MP4_OSS_ACCESS_KEY_SECRET }}
          args: cp -f /tmp/oss-upload-test.txt oss://${{ secrets.MP4_OSS_BUCKET_NAME }}/client/test_oss/oss-upload-test.txt