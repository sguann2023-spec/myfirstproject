name: Dev Build and Deploy to OSS

on:
  push:
    branches:
      - dev # 仅在推送到 dev 分支时触发

# 权限设置，确保可以读取代码并访问 Secret
permissions:
  contents: read
  id-token: write # 如果使用 OIDC 认证，则需要此权限

jobs:
  vars:
    runs-on: ubuntu-latest
    outputs:
      # 上传到时间戳目录: client/versioncode_yyyy-mm-dd_hh_mm_ss/
      oss_version_path: ${{ steps.set_path.outputs.oss_version_path }}
      oss_latest_path: versioncode
    steps:
      - uses: actions/checkout@v4

      - name: Set OSS Target Path
        id: set_path
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TIMESTAMP=$(date +%Y-%m-%d_%H_%M_%S)
          echo "oss_version_path=${VERSION}_${TIMESTAMP}/" >> $GITHUB_OUTPUT
        shell: bash
        working-directory: ${{ github.workspace }}

  # 任务 2A: macOS 构建并上传到 OSS
  build-and-deploy-mac-dev:
    runs-on: macos-latest
    needs: vars
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import macOS signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Prepare macOS signing environment
        shell: bash
        run: |
          echo "CSC_NAME=Keroro Software LLC (45UTGNZ6A4)" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning
      
      - name: Build Mac application
        run: pnpm run build:mac -- --universal
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify macOS code signing
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          SIGNING_IDENTITY="Developer ID Application: Keroro Software LLC (45UTGNZ6A4)"
          APP_PATH=$(find build -type d -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in build directory."
            find build -maxdepth 3 -print
            exit 1
          fi
          APP_SIGN_INFO=$(codesign -dv --verbose=4 "$APP_PATH" 2>&1)
          echo "$APP_SIGN_INFO"
          echo "$APP_SIGN_INFO" | grep -q "Authority=Developer ID Application: Keroro Software LLC (45UTGNZ6A4)"
          echo "$APP_SIGN_INFO" | grep -q "TeamIdentifier=45UTGNZ6A4"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          DMG_PATH=$(find build -maxdepth 2 -type f -name "*.dmg" | head -n 1)
          if [ -z "$DMG_PATH" ]; then
            echo "No .dmg artifact found in build directory."
            find build -maxdepth 3 -print
            exit 1
          fi
          codesign --force --sign "$SIGNING_IDENTITY" --options runtime "$DMG_PATH"
          DMG_SIGN_INFO=$(codesign -dv --verbose=4 "$DMG_PATH" 2>&1)
          echo "$DMG_SIGN_INFO"
          echo "$DMG_SIGN_INFO" | grep -q "Authority=Developer ID Application: Keroro Software LLC (45UTGNZ6A4)"
          echo "$DMG_SIGN_INFO" | grep -q "TeamIdentifier=45UTGNZ6A4"

          xcrun notarytool submit "$DMG_PATH" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"

          MOUNT_POINT=$(mktemp -d)
          hdiutil attach "$DMG_PATH" -nobrowse -mountpoint "$MOUNT_POINT" >/dev/null
          DMG_APP_PATH=$(find "$MOUNT_POINT" -maxdepth 2 -type d -name "*.app" | head -n 1)
          if [ -z "$DMG_APP_PATH" ]; then
            hdiutil detach "$MOUNT_POINT" >/dev/null || true
            rmdir "$MOUNT_POINT" || true
            echo "No .app found inside dmg."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$DMG_APP_PATH"
          spctl --assess --type execute --verbose=4 "$DMG_APP_PATH"
          hdiutil detach "$MOUNT_POINT" >/dev/null
          rmdir "$MOUNT_POINT"

      - name: Install ossutil
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/1.7.16/ossutilmac64 -o ossutil
          chmod +x ossutil
          sudo mv ossutil /usr/local/bin/ossutil
          ossutil --version

      - name: Deploy Mac Assets to OSS
        env:
          MP4_OSS_ENDPOINT: ${{ secrets.MP4_OSS_ENDPOINT }}
          MP4_OSS_ACCESS_KEY_ID: ${{ secrets.MP4_OSS_ACCESS_KEY_ID }}
          MP4_OSS_ACCESS_KEY_SECRET: ${{ secrets.MP4_OSS_ACCESS_KEY_SECRET }}
          MP4_OSS_BUCKET_NAME: ${{ secrets.MP4_OSS_BUCKET_NAME }}
        run: |
          ossutil config -e "${MP4_OSS_ENDPOINT}" -i "${MP4_OSS_ACCESS_KEY_ID}" -k "${MP4_OSS_ACCESS_KEY_SECRET}" -L CH -c /tmp/.ossutilconfig
          ossutil cp -f build/*.zip "oss://${MP4_OSS_BUCKET_NAME}/client/${{ needs.vars.outputs.oss_version_path }}" -c /tmp/.ossutilconfig
          ossutil cp -f build/*.dmg "oss://${MP4_OSS_BUCKET_NAME}/client/${{ needs.vars.outputs.oss_version_path }}" -c /tmp/.ossutilconfig
          ossutil cp -f build/latest-mac.yml "oss://${MP4_OSS_BUCKET_NAME}/client/${{ needs.vars.outputs.oss_version_path }}" -c /tmp/.ossutilconfig

  # 任务 2B: Windows 构建并上传到 OSS
  build-and-deploy-win-dev:
    runs-on: windows-latest
    needs: vars
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build Windows application
        run: pnpm run build:win
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Download EVSign CLI
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://down.evsign.cn/software/SignClient_v2.3.1_CLI.exe" -OutFile "SignClient.exe"

      - name: Sign Windows installer
        shell: powershell
        env:
          EVSIGN_LICENSE: ${{ secrets.EVSIGN_LICENSE }}
        run: |
          $exe = Get-ChildItem -Path "build" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No Windows installer (.exe) found in build directory." }
          .\SignClient.exe "$($exe.FullName)" -key "$env:EVSIGN_LICENSE" -sha256

      - name: Verify signature
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path "build" -Filter "*.exe" | Select-Object -First 1
          $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
          if ($sig.Status -ne 'Valid') { throw "Signature verification failed: $($sig.Status)" }
          Write-Host "Signed file: $($exe.Name)"

      - name: Install ossutil (Windows)
        shell: bash
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/1.7.16/ossutil64.exe -o ossutil64.exe
          chmod +x ossutil64.exe
          ./ossutil64.exe --version

      - name: Deploy Windows Assets to OSS
        shell: bash
        env:
          MP4_OSS_ENDPOINT: ${{ secrets.MP4_OSS_ENDPOINT }}
          MP4_OSS_ACCESS_KEY_ID: ${{ secrets.MP4_OSS_ACCESS_KEY_ID }}
          MP4_OSS_ACCESS_KEY_SECRET: ${{ secrets.MP4_OSS_ACCESS_KEY_SECRET }}
          MP4_OSS_BUCKET_NAME: ${{ secrets.MP4_OSS_BUCKET_NAME }}
        run: |
          ./ossutil64.exe config -e "${MP4_OSS_ENDPOINT}" -i "${MP4_OSS_ACCESS_KEY_ID}" -k "${MP4_OSS_ACCESS_KEY_SECRET}" -L CH -c /tmp/.ossutilconfig
          ./ossutil64.exe cp -f build/*.exe "oss://${MP4_OSS_BUCKET_NAME}/client/${{ needs.vars.outputs.oss_version_path }}" -c /tmp/.ossutilconfig
          ./ossutil64.exe cp -f build/latest.yml "oss://${MP4_OSS_BUCKET_NAME}/client/${{ needs.vars.outputs.oss_version_path }}" -c /tmp/.ossutilconfig
