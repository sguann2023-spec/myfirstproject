name: Dev Build and Deploy to OSS

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dev-build-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  vars:
    runs-on: ubuntu-latest
    outputs:
      oss_version_path: ${{ steps.set_path.outputs.oss_version_path }}
      oss_latest_path: versioncode
    steps:
      - uses: actions/checkout@v4

      - name: Set OSS Target Path
        id: set_path
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TIMESTAMP=$(date +%Y-%m-%d_%H_%M_%S)
          echo "oss_version_path=${VERSION}_${TIMESTAMP}/" >> $GITHUB_OUTPUT
        shell: bash
        working-directory: ${{ github.workspace }}

  # 任务 2A: macOS 构建并上传到 OSS
  build-and-deploy-mac-dev:
    runs-on: macos-latest
    timeout-minutes: 120
    needs: vars
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Import macOS signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Prepare macOS signing environment
        shell: bash
        run: |
          [ -n "${APPLE_ID:-}" ] || { echo "Missing APPLE_ID secret"; exit 1; }
          [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] || { echo "Missing APPLE_APP_SPECIFIC_PASSWORD secret"; exit 1; }
          [ -n "${APPLE_TEAM_ID:-}" ] || { echo "Missing APPLE_TEAM_ID secret"; exit 1; }
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build Mac applications (x64 + arm64 + universal)
        run: |
          rm -rf build
          pnpm run build:vite
          electron-builder --mac dmg zip --x64 --arm64 --publish never --config.mac.forceCodeSigning=true
          electron-builder --mac dmg zip --universal --publish never --config.mac.forceCodeSigning=true
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          DEBUG: electron-builder
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify macOS code signing & notarization
        timeout-minutes: 80
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          PROPAGATION_SLEEP_SECONDS=69
          STAPLE_RETRY_SLEEP_SECONDS=69
          MOUNT_POINT=""
          cleanup_mount() {
            if [ -n "${MOUNT_POINT:-}" ] && mount | grep -q "on ${MOUNT_POINT} "; then
              hdiutil detach "$MOUNT_POINT" >/dev/null || true
            fi
            if [ -n "${MOUNT_POINT:-}" ]; then
              rmdir "$MOUNT_POINT" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_mount EXIT
          shopt -s nullglob
          DMGS=(build/*.dmg)
          if [ "${#DMGS[@]}" -eq 0 ]; then
            echo "No .dmg artifacts found in build directory."
            find build -maxdepth 3 -print
            exit 1
          fi

          for DMG_PATH in "${DMGS[@]}"; do
            echo "===== Verifying DMG: $DMG_PATH ====="
            codesign -dv --verbose=4 "$DMG_PATH" 2>&1 || true

            MOUNT_POINT=$(mktemp -d)
            hdiutil attach "$DMG_PATH" -nobrowse -mountpoint "$MOUNT_POINT" >/dev/null
            DMG_APP_PATH=$(find "$MOUNT_POINT" -maxdepth 2 -type d -name "*.app" | head -n 1)
            if [ -z "$DMG_APP_PATH" ]; then
              hdiutil detach "$MOUNT_POINT" >/dev/null || true
              rmdir "$MOUNT_POINT" || true
              echo "No .app found inside dmg before notarization: $DMG_PATH"
              exit 1
            fi
            DMG_APP_NAME=$(basename "$DMG_APP_PATH" .app)
            DMG_APP_BIN="$DMG_APP_PATH/Contents/MacOS/$DMG_APP_NAME"
            if [ ! -f "$DMG_APP_BIN" ]; then
              DMG_APP_BIN=$(find "$DMG_APP_PATH/Contents/MacOS" -maxdepth 1 -type f | head -n 1)
            fi
            if [ -z "$DMG_APP_BIN" ]; then
              hdiutil detach "$MOUNT_POINT" >/dev/null || true
              rmdir "$MOUNT_POINT" || true
              echo "No main executable found inside dmg app: $DMG_PATH"
              exit 1
            fi
            echo "===== DMG internal app sign info ====="
            DMG_APP_SIGN_INFO=$(codesign -dv --verbose=4 "$DMG_APP_BIN" 2>&1)
            echo "$DMG_APP_SIGN_INFO"
            echo "$DMG_APP_SIGN_INFO" | grep -q "Authority=Developer ID Application: Keroro Software LLC (45UTGNZ6A4)"
            echo "$DMG_APP_SIGN_INFO" | grep -q "TeamIdentifier=45UTGNZ6A4"
            codesign --verify --strict --verbose=4 "$DMG_APP_BIN"
            codesign --verify --deep --strict --verbose=2 "$DMG_APP_PATH"
            spctl --assess --type execute --verbose=4 "$DMG_APP_PATH"
            hdiutil detach "$MOUNT_POINT" >/dev/null
            rmdir "$MOUNT_POINT"
            MOUNT_POINT=""

            if xcrun stapler validate "$DMG_PATH" >/dev/null 2>&1; then
              echo "DMG already stapled, skip notarization: $DMG_PATH"
            else
              echo "Submitting DMG to Apple notary service: $DMG_PATH"
              NOTARY_JSON=$(xcrun notarytool submit "$DMG_PATH" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --wait --output-format json)
              echo "$NOTARY_JSON"

              SUB_ID=$(echo "$NOTARY_JSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))")
              SUB_STATUS=$(echo "$NOTARY_JSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status',''))")

              if [ "$SUB_STATUS" != "Accepted" ]; then
                echo "Notarization status: $SUB_STATUS, fetching log for $SUB_ID ..."
                xcrun notarytool log "$SUB_ID" \
                  --apple-id "$APPLE_ID" \
                  --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                  --team-id "$APPLE_TEAM_ID" || true
                exit 1
              fi

              echo "Waiting for notarization ticket propagation..."
              sleep "$PROPAGATION_SLEEP_SECONDS"

              STAPLE_OK=0
              for attempt in 1 2 3 4 5; do
                echo "Staple attempt $attempt for $DMG_PATH..."
                if xcrun stapler staple "$DMG_PATH" && xcrun stapler validate "$DMG_PATH"; then
                  STAPLE_OK=1
                  break
                fi
                sleep "$STAPLE_RETRY_SLEEP_SECONDS"
              done

              if [ "$STAPLE_OK" -ne 1 ]; then
                echo "The staple and validate action failed after retries for $DMG_PATH."
                exit 65
              fi
            fi

            spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"
          done

      - name: Upload mac signing diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-signing-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            build/builder-debug.yml
            build/builder-effective-config.yaml
            build/latest-mac.yml

      - name: Install ossutil
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/1.7.16/ossutilmac64 -o ossutil
          chmod +x ossutil
          sudo mv ossutil /usr/local/bin/ossutil
          ossutil --version

      - name: Deploy Mac Assets to OSS
        env:
          MP4_OSS_ENDPOINT: ${{ secrets.MP4_OSS_ENDPOINT }}
          MP4_OSS_ACCESS_KEY_ID: ${{ secrets.MP4_OSS_ACCESS_KEY_ID }}
          MP4_OSS_ACCESS_KEY_SECRET: ${{ secrets.MP4_OSS_ACCESS_KEY_SECRET }}
          MP4_OSS_BUCKET_NAME: ${{ secrets.MP4_OSS_BUCKET_NAME }}
        run: |
          ossutil config -e "${MP4_OSS_ENDPOINT}" -i "${MP4_OSS_ACCESS_KEY_ID}" -k "${MP4_OSS_ACCESS_KEY_SECRET}" -L CH -c /tmp/.ossutilconfig
          shopt -s nullglob
          DEST="oss://${MP4_OSS_BUCKET_NAME}/client/${{ needs.vars.outputs.oss_version_path }}"
          FILES=(build/*.zip build/*.dmg build/latest-mac.yml)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No mac artifacts found to upload."
            exit 1
          fi
          for f in "${FILES[@]}"; do
            echo "Uploading $f to $DEST"
            ossutil cp -f "$f" "$DEST" -c /tmp/.ossutilconfig
          done

  # 任务 2B: Windows 构建并上传到 OSS
  build-and-deploy-win-dev:
    runs-on: windows-latest
    needs: vars
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild Electron native dependencies (Windows)
        shell: bash
        run: pnpm exec electron-builder install-app-deps

      - name: Validate native bindings before packaging
        shell: bash
        run: |
          set -euo pipefail
          NODE_COUNT=$(find node_modules -type f -name "*.node" | wc -l | tr -d ' ')
          echo "Detected native .node files: ${NODE_COUNT}"
          if [ "${NODE_COUNT}" -eq 0 ]; then
            echo "No native bindings found in node_modules; aborting Windows package build."
            exit 1
          fi

      - name: Build Windows application
        run: pnpm run build:win
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Download EVSign CLI
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://down.evsign.cn/software/SignClient_v2.3.1_CLI.exe" -OutFile "SignClient.exe"

      - name: Sign Windows installer
        shell: powershell
        env:
          EVSIGN_LICENSE: ${{ secrets.EVSIGN_LICENSE }}
        run: |
          $exe = Get-ChildItem -Path "build" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No Windows installer (.exe) found in build directory." }
          .\SignClient.exe "$($exe.FullName)" -key "$env:EVSIGN_LICENSE" -sha256

      - name: Verify signature
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path "build" -Filter "*.exe" | Select-Object -First 1
          $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
          if ($sig.Status -ne 'Valid') { throw "Signature verification failed: $($sig.Status)" }
          Write-Host "Signed file: $($exe.Name)"

      - name: Install ossutil (Windows)
        shell: bash
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/1.7.16/ossutil64.exe -o ossutil64.exe
          chmod +x ossutil64.exe
          ./ossutil64.exe --version

      - name: Deploy Windows Assets to OSS
        shell: bash
        env:
          MP4_OSS_ENDPOINT: ${{ secrets.MP4_OSS_ENDPOINT }}
          MP4_OSS_ACCESS_KEY_ID: ${{ secrets.MP4_OSS_ACCESS_KEY_ID }}
          MP4_OSS_ACCESS_KEY_SECRET: ${{ secrets.MP4_OSS_ACCESS_KEY_SECRET }}
          MP4_OSS_BUCKET_NAME: ${{ secrets.MP4_OSS_BUCKET_NAME }}
        run: |
          ./ossutil64.exe config -e "${MP4_OSS_ENDPOINT}" -i "${MP4_OSS_ACCESS_KEY_ID}" -k "${MP4_OSS_ACCESS_KEY_SECRET}" -L CH -c /tmp/.ossutilconfig
          ./ossutil64.exe cp -f build/*.exe "oss://${MP4_OSS_BUCKET_NAME}/client/${{ needs.vars.outputs.oss_version_path }}" -c /tmp/.ossutilconfig
          ./ossutil64.exe cp -f build/latest.yml "oss://${MP4_OSS_BUCKET_NAME}/client/${{ needs.vars.outputs.oss_version_path }}" -c /tmp/.ossutilconfig
