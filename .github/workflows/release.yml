name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  # 任务1：创建 Tag (保持不变)
  create-tag:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      
      - name: Get version from package.json
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
      - name: Create Tag
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const version = '${{ steps.package-version.outputs.version }}'
            const tagName = `v${version}`
            
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tagName}`
              })
              console.log(`Tag ${tagName} already exists.`)
            } catch (error) {
              const sha = context.sha
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tagName}`,
                sha: sha
              })
              console.log(`Created tag ${tagName} at ${sha}`)
            }

  # 任务 2：【新增】创建 Release 草稿 (Draft)
  # 确保在任何资产上传之前，Release 对象已经存在
  create-release-draft:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_TOKEN }}
          repository: sun-guannan/CapCutMaker 
          tag_name: ${{ github.ref }}
          name: ${{ github.ref_name }}
          draft: true # 关键：创建为草稿，资产上传完成后再发布

  # 任务 3A: macOS 构建并上传 macOS 资产到 Release 草稿
  # 注意：Job 名称改为 build-and-upload-mac 以示区别
  build-and-upload-mac:
    runs-on: macos-latest
    timeout-minutes: 120
    if: startsWith(github.ref, 'refs/tags/')
    needs: create-release-draft # 依赖 Release 草稿存在
    permissions:
      contents: write 
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import macOS signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Prepare macOS signing environment
        shell: bash
        run: |
          [ -n "${APPLE_ID:-}" ] || { echo "Missing APPLE_ID secret"; exit 1; }
          [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] || { echo "Missing APPLE_APP_SPECIFIC_PASSWORD secret"; exit 1; }
          [ -n "${APPLE_TEAM_ID:-}" ] || { echo "Missing APPLE_TEAM_ID secret"; exit 1; }
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      
      - name: Build Mac application
        run: |
          rm -rf build
          pnpm run build:mac:ci
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          DEBUG: electron-builder
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify macOS code signing & notarization
        timeout-minutes: 80
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          PROPAGATION_SLEEP_SECONDS=69
          STAPLE_RETRY_SLEEP_SECONDS=69

          SIGNING_IDENTITY="Developer ID Application: Keroro Software LLC (45UTGNZ6A4)"
          resolve_artifacts() {
            APP_PATH=$(find build -maxdepth 2 -type d -name "*.app" | head -n 1)
            if [ -z "$APP_PATH" ]; then
              echo "No .app bundle found in build output."
              find build -maxdepth 3 -print
              exit 1
            fi
            DMG_PATH=$(find build -maxdepth 2 -type f -name "*.dmg" | head -n 1)
            if [ -z "$DMG_PATH" ]; then
              echo "No .dmg artifact found in build directory."
              find build -maxdepth 3 -print
              exit 1
            fi
          }

          verify_app_signing_chain() {
            local app_path="$1"
            local framework_path="$app_path/Contents/Frameworks/Electron Framework.framework"
            echo "===== .app codesign info ====="
            APP_SIGN_INFO=$(codesign -dv --verbose=4 "$app_path" 2>&1)
            echo "$APP_SIGN_INFO"
            echo "$APP_SIGN_INFO" | grep -q "Authority=Developer ID Application: Keroro Software LLC (45UTGNZ6A4)"
            echo "$APP_SIGN_INFO" | grep -q "TeamIdentifier=45UTGNZ6A4"
            if [ -d "$framework_path" ]; then
              echo "===== Electron Framework sign info ====="
              codesign -dv --verbose=4 "$framework_path" 2>&1 || true
            fi
            codesign --verify --deep --strict --verbose=2 "$app_path"
            spctl --assess --type execute --verbose=4 "$app_path"
          }

          resolve_artifacts
          if ! verify_app_signing_chain "$APP_PATH"; then
            echo "App signing chain invalid, rebuilding mac artifacts once..."
            rm -rf build
            pnpm run build:mac:ci
            resolve_artifacts
            verify_app_signing_chain "$APP_PATH"
          fi

          MOUNT_POINT=""
          cleanup_mount() {
            if [ -n "${MOUNT_POINT:-}" ] && mount | grep -q "on ${MOUNT_POINT} "; then
              hdiutil detach "$MOUNT_POINT" >/dev/null || true
            fi
            if [ -n "${MOUNT_POINT:-}" ]; then
              rmdir "$MOUNT_POINT" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_mount EXIT

          echo "===== DMG codesign info (current) ====="
          codesign -dv --verbose=4 "$DMG_PATH" 2>&1 || true

          if ! codesign -dv "$DMG_PATH" 2>&1 | grep -q "Authority=Developer ID Application"; then
            echo "DMG not signed yet, signing now (no hardened runtime for DMG)..."
            codesign --force --sign "$SIGNING_IDENTITY" --timestamp "$DMG_PATH"
            codesign -dv --verbose=4 "$DMG_PATH"
          fi

          MOUNT_POINT=$(mktemp -d)
          hdiutil attach "$DMG_PATH" -nobrowse -mountpoint "$MOUNT_POINT" >/dev/null
          DMG_APP_PATH=$(find "$MOUNT_POINT" -maxdepth 2 -type d -name "*.app" | head -n 1)
          if [ -z "$DMG_APP_PATH" ]; then
            hdiutil detach "$MOUNT_POINT" >/dev/null || true
            rmdir "$MOUNT_POINT" || true
            echo "No .app found inside dmg before notarization."
            exit 1
          fi
          DMG_APP_NAME=$(basename "$DMG_APP_PATH" .app)
          DMG_APP_BIN="$DMG_APP_PATH/Contents/MacOS/$DMG_APP_NAME"
          if [ ! -f "$DMG_APP_BIN" ]; then
            DMG_APP_BIN=$(find "$DMG_APP_PATH/Contents/MacOS" -maxdepth 1 -type f | head -n 1)
          fi
          if [ -z "$DMG_APP_BIN" ]; then
            hdiutil detach "$MOUNT_POINT" >/dev/null || true
            rmdir "$MOUNT_POINT" || true
            echo "No main executable found inside dmg app."
            exit 1
          fi
          echo "===== DMG internal app sign info ====="
          DMG_APP_SIGN_INFO=$(codesign -dv --verbose=4 "$DMG_APP_BIN" 2>&1)
          echo "$DMG_APP_SIGN_INFO"
          echo "$DMG_APP_SIGN_INFO" | grep -q "Authority=Developer ID Application: Keroro Software LLC (45UTGNZ6A4)"
          echo "$DMG_APP_SIGN_INFO" | grep -q "TeamIdentifier=45UTGNZ6A4"
          codesign --verify --strict --verbose=4 "$DMG_APP_BIN"
          codesign --verify --deep --strict --verbose=2 "$DMG_APP_PATH"
          spctl --assess --type execute --verbose=4 "$DMG_APP_PATH"
          hdiutil detach "$MOUNT_POINT" >/dev/null
          rmdir "$MOUNT_POINT"
          MOUNT_POINT=""

          if xcrun stapler validate "$DMG_PATH" >/dev/null 2>&1; then
            echo "DMG already stapled, skip notarization."
          else
            echo "Submitting DMG to Apple notary service..."
            NOTARY_JSON=$(xcrun notarytool submit "$DMG_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait --output-format json)
            echo "$NOTARY_JSON"

            SUB_ID=$(echo "$NOTARY_JSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))")
            SUB_STATUS=$(echo "$NOTARY_JSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status',''))")

            if [ "$SUB_STATUS" != "Accepted" ]; then
              echo "Notarization status: $SUB_STATUS, fetching log for $SUB_ID ..."
              xcrun notarytool log "$SUB_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" || true
              exit 1
            fi

            echo "Waiting for notarization ticket propagation..."
            sleep "$PROPAGATION_SLEEP_SECONDS"

            STAPLE_OK=0
            for attempt in 1 2 3 4 5; do
              echo "Staple attempt $attempt..."
              if xcrun stapler staple "$DMG_PATH" && xcrun stapler validate "$DMG_PATH"; then
                STAPLE_OK=1
                break
              fi
              sleep "$STAPLE_RETRY_SLEEP_SECONDS"
            done

            if [ "$STAPLE_OK" -ne 1 ]; then
              echo "The staple and validate action failed after retries."
              exit 65
            fi
          fi

          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"

      - name: Upload mac signing diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-signing-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            build/builder-debug.yml
            build/builder-effective-config.yaml
            build/latest-mac.yml

      # 关键步骤 1: 上传 macOS 资产 (只附加文件到已有的 Release 草稿)
      - name: Upload macOS Assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_TOKEN }} 
          repository: sun-guannan/CapCutMaker 
          files: |
            build/*.zip
            build/*.dmg
            build/latest-mac.yml
          tag_name: ${{ github.ref }}
          draft: true  # 关键：仅上传到草稿，禁止该步骤发布
          # 关键：设置为仅上传资产，不更改 Release 状态 (upload_assets_only: true 在 V2 中已被移除)
          # 由于我们已经创建了草稿，这个步骤将自动附加文件。

      - name: Install ossutil
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/1.7.16/ossutilmac64 -o ossutil
          chmod +x ossutil
          sudo mv ossutil /usr/local/bin/ossutil
          ossutil --version

      - name: Deploy macOS Assets to OSS (Latest Path)
        env:
          MP4_OSS_ENDPOINT: ${{ secrets.MP4_OSS_ENDPOINT }}
          MP4_OSS_ACCESS_KEY_ID: ${{ secrets.MP4_OSS_ACCESS_KEY_ID }}
          MP4_OSS_ACCESS_KEY_SECRET: ${{ secrets.MP4_OSS_ACCESS_KEY_SECRET }}
          MP4_OSS_BUCKET_NAME: ${{ secrets.MP4_OSS_BUCKET_NAME }}
        run: |
          MAC_ZIP=$(ls build/*.zip | head -n 1)
          MAC_DMG=$(ls build/*.dmg | head -n 1)
          cp "$MAC_ZIP" build/VectCut-latest-universal.zip
          cp "$MAC_DMG" build/VectCut-latest-universal.dmg
          VERSION=$(node -p "require('./package.json').version")
          ZIP_SIZE=$(stat -f%z build/VectCut-latest-universal.zip)
          ZIP_SHA512=$(shasum -a 512 build/VectCut-latest-universal.zip | awk '{print $1}' | xxd -r -p | base64)
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          cat > build/latest-mac.yml <<EOF
          version: ${VERSION}
          files:
            - url: VectCut-latest-universal.zip
              sha512: ${ZIP_SHA512}
              size: ${ZIP_SIZE}
          path: VectCut-latest-universal.zip
          sha512: ${ZIP_SHA512}
          releaseDate: '${RELEASE_DATE}'
          EOF
          ossutil config -e "${MP4_OSS_ENDPOINT}" -i "${MP4_OSS_ACCESS_KEY_ID}" -k "${MP4_OSS_ACCESS_KEY_SECRET}" -L CH -c /tmp/.ossutilconfig
          ossutil cp -f build/VectCut-latest-universal.zip "oss://${MP4_OSS_BUCKET_NAME}/client/latest/VectCut-latest-universal.zip" -c /tmp/.ossutilconfig
          ossutil cp -f build/VectCut-latest-universal.dmg "oss://${MP4_OSS_BUCKET_NAME}/client/latest/VectCut-latest-universal.dmg" -c /tmp/.ossutilconfig
          ossutil cp -f build/latest-mac.yml "oss://${MP4_OSS_BUCKET_NAME}/client/latest/latest-mac.yml" -c /tmp/.ossutilconfig

  # 任务 3B: Windows 构建并上传 Windows 资产到 Release 草稿
  # 注意：Job 名称改为 build-and-upload-win 以示区别
  build-and-upload-win:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: create-release-draft # 依赖 Release 草稿存在
    permissions:
      contents: write 
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build Windows application
        run: pnpm run build:win
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Download EVSign CLI
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://down.evsign.cn/software/SignClient_v2.3.1_CLI.exe" -OutFile "SignClient.exe"

      - name: Sign Windows installer
        shell: powershell
        env:
          EVSIGN_LICENSE: ${{ secrets.EVSIGN_LICENSE }}
        run: |
          $exe = Get-ChildItem -Path "build" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No Windows installer (.exe) found in build directory." }
          .\SignClient.exe "$($exe.FullName)" -key "$env:EVSIGN_LICENSE" -sha256

      - name: Verify signature
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path "build" -Filter "*.exe" | Select-Object -First 1
          $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
          if ($sig.Status -ne 'Valid') { throw "Signature verification failed: $($sig.Status)" }
          Write-Host "Signed file: $($exe.Name)"

      # 关键步骤 2: 上传 Windows 资产 (只附加文件到已有的 Release 草稿)
      - name: Upload Windows Assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_TOKEN }} 
          repository: sun-guannan/CapCutMaker 
          files: |
            build/*.exe
            build/latest.yml
          tag_name: ${{ github.ref }}
          draft: true  # 关键：仅上传到草稿，禁止该步骤发布

      - name: Install ossutil (Windows)
        shell: bash
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/1.7.16/ossutil64.exe -o ossutil64.exe
          chmod +x ossutil64.exe

      - name: Deploy Windows Assets to OSS (Latest Path)
        shell: bash
        env:
          MP4_OSS_ENDPOINT: ${{ secrets.MP4_OSS_ENDPOINT }}
          MP4_OSS_ACCESS_KEY_ID: ${{ secrets.MP4_OSS_ACCESS_KEY_ID }}
          MP4_OSS_ACCESS_KEY_SECRET: ${{ secrets.MP4_OSS_ACCESS_KEY_SECRET }}
          MP4_OSS_BUCKET_NAME: ${{ secrets.MP4_OSS_BUCKET_NAME }}
        run: |
          WIN_EXE=$(ls build/*.exe | head -n 1)
          cp "$WIN_EXE" build/VectCut-Setup-latest-x64.exe
          node -e "const fs=require('fs');const p='build/latest.yml';let s=fs.readFileSync(p,'utf8');s=s.replace(/[\w.-]+\.exe/g,'VectCut-Setup-latest-x64.exe');fs.writeFileSync(p,s);"
          ./ossutil64.exe config -e "${MP4_OSS_ENDPOINT}" -i "${MP4_OSS_ACCESS_KEY_ID}" -k "${MP4_OSS_ACCESS_KEY_SECRET}" -L CH -c /tmp/.ossutilconfig
          ./ossutil64.exe cp -f build/VectCut-Setup-latest-x64.exe "oss://${MP4_OSS_BUCKET_NAME}/client/latest/VectCut-Setup-latest-x64.exe" -c /tmp/.ossutilconfig
          ./ossutil64.exe cp -f build/latest.yml "oss://${MP4_OSS_BUCKET_NAME}/client/latest/latest.yml" -c /tmp/.ossutilconfig

  # 任务 4: 流程终点，并将 Release 草稿发布
  release-complete:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && needs.build-and-upload-mac.result == 'success' && needs.build-and-upload-win.result == 'success'
    # 依赖所有构建/上传任务
    needs: [build-and-upload-mac, build-and-upload-win] 
    permissions:
      contents: write
    steps:
      - name: Wait 60 seconds for asset processing
        run: sleep 60
        shell: bash

      - name: Publish Final Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_TOKEN }}
          repository: sun-guannan/CapCutMaker 
          tag_name: ${{ github.ref }}
          draft: false # 关键：将 Release 草稿正式发布
          prerelease: false

      - name: Release Process Finished
        run: echo "Assets uploaded and Release ${{ github.ref }} published!"
