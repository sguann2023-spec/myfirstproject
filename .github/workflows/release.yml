name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  # 任务1：创建 Tag (保持不变)
  create-tag:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      
      - name: Get version from package.json
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
      - name: Create Tag
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const version = '${{ steps.package-version.outputs.version }}'
            const tagName = `v${version}`
            
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tagName}`
              })
              console.log(`Tag ${tagName} already exists.`)
            } catch (error) {
              const sha = context.sha
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tagName}`,
                sha: sha
              })
              console.log(`Created tag ${tagName} at ${sha}`)
            }

  # 任务 2：【新增】创建 Release 草稿 (Draft)
  # 确保在任何资产上传之前，Release 对象已经存在
  create-release-draft:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_TOKEN }}
          repository: sun-guannan/CapCutMaker 
          tag_name: ${{ github.ref }}
          name: ${{ github.ref_name }}
          draft: true # 关键：创建为草稿，资产上传完成后再发布

  # 任务 3A: macOS 构建并上传 macOS 资产到 Release 草稿
  # 注意：Job 名称改为 build-and-upload-mac 以示区别
  build-and-upload-mac:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: create-release-draft # 依赖 Release 草稿存在
    permissions:
      contents: write 
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prepare macOS signing certificate
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/macos-signing-cert.p12"
          export CERT_PATH
          python3 -c "import os,base64;open(os.environ['CERT_PATH'],'wb').write(base64.b64decode(os.environ['MACOS_CERT_P12_BASE64']))"
          echo "CSC_LINK=$CERT_PATH" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$MACOS_CERT_PASSWORD" >> "$GITHUB_ENV"
      
      - name: Build Mac application
        run: yarn build:mac --universal
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify macOS code signing
        shell: bash
        run: |
          APP_PATH=$(find build -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in build directory."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      # 关键步骤 1: 上传 macOS 资产 (只附加文件到已有的 Release 草稿)
      - name: Upload macOS Assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_TOKEN }} 
          repository: sun-guannan/CapCutMaker 
          files: |
            build/*.zip
            build/*.dmg
            build/latest-mac.yml
          tag_name: ${{ github.ref }}
          draft: true  # 关键：仅上传到草稿，禁止该步骤发布
          # 关键：设置为仅上传资产，不更改 Release 状态 (upload_assets_only: true 在 V2 中已被移除)
          # 由于我们已经创建了草稿，这个步骤将自动附加文件。

      - name: Install ossutil
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/1.7.16/ossutilmac64 -o ossutil
          chmod +x ossutil
          sudo mv ossutil /usr/local/bin/ossutil
          ossutil --version

      - name: Deploy macOS Assets to OSS (Latest Path)
        env:
          MP4_OSS_ENDPOINT: ${{ secrets.MP4_OSS_ENDPOINT }}
          MP4_OSS_ACCESS_KEY_ID: ${{ secrets.MP4_OSS_ACCESS_KEY_ID }}
          MP4_OSS_ACCESS_KEY_SECRET: ${{ secrets.MP4_OSS_ACCESS_KEY_SECRET }}
          MP4_OSS_BUCKET_NAME: ${{ secrets.MP4_OSS_BUCKET_NAME }}
        run: |
          MAC_ZIP=$(ls build/*.zip | head -n 1)
          MAC_DMG=$(ls build/*.dmg | head -n 1)
          cp "$MAC_ZIP" build/VectCut-latest-universal.zip
          cp "$MAC_DMG" build/VectCut-latest-universal.dmg
          node -e "const fs=require('fs');const p='build/latest-mac.yml';let s=fs.readFileSync(p,'utf8');s=s.replace(/[\w.-]+\.zip/g,'VectCut-latest-universal.zip').replace(/[\w.-]+\.dmg/g,'VectCut-latest-universal.dmg');fs.writeFileSync(p,s);"
          ossutil config -e "${MP4_OSS_ENDPOINT}" -i "${MP4_OSS_ACCESS_KEY_ID}" -k "${MP4_OSS_ACCESS_KEY_SECRET}" -L CH -c /tmp/.ossutilconfig
          ossutil cp -f build/VectCut-latest-universal.zip "oss://${MP4_OSS_BUCKET_NAME}/client/latest/VectCut-latest-universal.zip" -c /tmp/.ossutilconfig
          ossutil cp -f build/VectCut-latest-universal.dmg "oss://${MP4_OSS_BUCKET_NAME}/client/latest/VectCut-latest-universal.dmg" -c /tmp/.ossutilconfig
          ossutil cp -f build/latest-mac.yml "oss://${MP4_OSS_BUCKET_NAME}/client/latest/latest-mac.yml" -c /tmp/.ossutilconfig

  # 任务 3B: Windows 构建并上传 Windows 资产到 Release 草稿
  # 注意：Job 名称改为 build-and-upload-win 以示区别
  build-and-upload-win:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: create-release-draft # 依赖 Release 草稿存在
    permissions:
      contents: write 
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      - name: Build Windows application
        run: yarn build:win
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Download EVSign CLI
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://down.evsign.cn/software/SignClient_v2.3.1_CLI.exe" -OutFile "SignClient.exe"

      - name: Sign Windows installer
        shell: powershell
        env:
          EVSIGN_LICENSE: ${{ secrets.EVSIGN_LICENSE }}
        run: |
          $exe = Get-ChildItem -Path "build" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No Windows installer (.exe) found in build directory." }
          .\SignClient.exe "$($exe.FullName)" -key "$env:EVSIGN_LICENSE" -sha256

      - name: Verify signature
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path "build" -Filter "*.exe" | Select-Object -First 1
          $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
          if ($sig.Status -ne 'Valid') { throw "Signature verification failed: $($sig.Status)" }
          Write-Host "Signed file: $($exe.Name)"

      # 关键步骤 2: 上传 Windows 资产 (只附加文件到已有的 Release 草稿)
      - name: Upload Windows Assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_TOKEN }} 
          repository: sun-guannan/CapCutMaker 
          files: |
            build/*.exe
            build/latest.yml
          tag_name: ${{ github.ref }}
          draft: true  # 关键：仅上传到草稿，禁止该步骤发布

      - name: Install ossutil (Windows)
        shell: bash
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/1.7.16/ossutil64.exe -o ossutil64.exe
          chmod +x ossutil64.exe

      - name: Deploy Windows Assets to OSS (Latest Path)
        shell: bash
        env:
          MP4_OSS_ENDPOINT: ${{ secrets.MP4_OSS_ENDPOINT }}
          MP4_OSS_ACCESS_KEY_ID: ${{ secrets.MP4_OSS_ACCESS_KEY_ID }}
          MP4_OSS_ACCESS_KEY_SECRET: ${{ secrets.MP4_OSS_ACCESS_KEY_SECRET }}
          MP4_OSS_BUCKET_NAME: ${{ secrets.MP4_OSS_BUCKET_NAME }}
        run: |
          WIN_EXE=$(ls build/*.exe | head -n 1)
          cp "$WIN_EXE" build/VectCut-Setup-latest-x64.exe
          node -e "const fs=require('fs');const p='build/latest.yml';let s=fs.readFileSync(p,'utf8');s=s.replace(/[\w.-]+\.exe/g,'VectCut-Setup-latest-x64.exe');fs.writeFileSync(p,s);"
          ./ossutil64.exe config -e "${MP4_OSS_ENDPOINT}" -i "${MP4_OSS_ACCESS_KEY_ID}" -k "${MP4_OSS_ACCESS_KEY_SECRET}" -L CH -c /tmp/.ossutilconfig
          ./ossutil64.exe cp -f build/VectCut-Setup-latest-x64.exe "oss://${MP4_OSS_BUCKET_NAME}/client/latest/VectCut-Setup-latest-x64.exe" -c /tmp/.ossutilconfig
          ./ossutil64.exe cp -f build/latest.yml "oss://${MP4_OSS_BUCKET_NAME}/client/latest/latest.yml" -c /tmp/.ossutilconfig

  # 任务 4: 流程终点，并将 Release 草稿发布
  release-complete:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && needs.build-and-upload-mac.result == 'success' && needs.build-and-upload-win.result == 'success'
    # 依赖所有构建/上传任务
    needs: [build-and-upload-mac, build-and-upload-win] 
    permissions:
      contents: write
    steps:
      - name: Wait 60 seconds for asset processing
        run: sleep 60
        shell: bash

      - name: Publish Final Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_TOKEN }}
          repository: sun-guannan/CapCutMaker 
          tag_name: ${{ github.ref }}
          draft: false # 关键：将 Release 草稿正式发布
          prerelease: false

      - name: Release Process Finished
        run: echo "Assets uploaded and Release ${{ github.ref }} published!"
