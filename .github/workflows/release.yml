name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  # 任务1：只创建 Tag。只在 main 分支 push 时运行。
  create-tag:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      
      - name: Get version from package.json
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
      - name: Create Tag
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const version = '${{ steps.package-version.outputs.version }}'
            const tagName = `v${version}`
            
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tagName}`
              })
              console.log(`Tag ${tagName} already exists.`)
            } catch (error) {
              const sha = context.sha
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tagName}`,
                sha: sha
              })
              console.log(`Created tag ${tagName} at ${sha}`)
            }
  
  # 任务 2A: macOS 构建并负责创建 Release 和上传 macOS 资产
  build-and-release-mac:
    runs-on: macos-latest # 锁定为 macOS
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write 
    strategy:
      matrix:
        node-version: [24.x] # Node 版本矩阵保持不变

    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      - name: Build Mac application
        run: yarn build:mac --universal
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # 关键步骤 1: 创建 Release 并上传 macOS 资产
      # 由于没有 upload_assets_only: true，此任务会负责创建 Release
      - name: Create or Update Release (macOS)
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_TOKEN }} 
          repository: sun-guannan/CapCutMaker 
          # 只上传 macOS 相关的资产
          files: |
            build/*.zip
            build/*.dmg
            build/latest-mac.yml 
          tag_name: ${{ github.ref }} # 使用当前 Tag 名称

  # 任务 2B: Windows 构建并附加 Windows 资产
  build-and-release-win:
    runs-on: windows-latest # 锁定为 Windows
    if: startsWith(github.ref, 'refs/tags/')
    # 强制依赖 macOS 任务，确保 Release 已被创建
    needs: build-and-release-mac 
    permissions:
      contents: write 
    strategy:
      matrix:
        node-version: [24.x] # Node 版本矩阵保持不变

    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      - name: Build Windows application
        run: yarn build:win
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # 关键步骤 2: 附加 Windows 资产
      # Release 已经存在，此任务只会附加文件，从而解决竞争条件
      - name: Attach Assets to Existing Release (Windows)
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_TOKEN }} 
          repository: sun-guannan/CapCutMaker 
          # 只上传 Windows 相关的资产
          files: |
            build/*.exe
            build/latest.yml
          tag_name: ${{ github.ref }} 

  # 任务 3: 确保所有构建完成后，仅用于依赖管理和后续流程（例如通知）。
  # **此任务不再下载或上传任何大文件，它只是一个流程的终点。**
  release-complete:
    runs-on: ubuntu-latest
    if: always() # 即使 Job 2 失败，也要记录完成情况
    needs: [build-and-release-asset] # 依赖所有构建任务
    steps:
      - name: Release Process Finished
        run: echo "All assets for ${{ github.ref }} should now be uploaded to CapCutMaker Release."

