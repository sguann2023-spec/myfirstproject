name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  # 任务1：只创建 Tag。只在 main 分支 push 时运行。
  create-tag:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      
      - name: Get version from package.json
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
      - name: Create Tag
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const version = '${{ steps.package-version.outputs.version }}'
            const tagName = `v${version}`
            
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tagName}`
              })
              console.log(`Tag ${tagName} already exists.`)
            } catch (error) {
              const sha = context.sha
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tagName}`,
                sha: sha
              })
              console.log(`Created tag ${tagName} at ${sha}`)
            }

  # 任务 2: 构建并直接发布到公共仓库 Release
  # 关键更改：移除 Artifact 步骤，直接在构建机上执行 Release 上传
  build-and-release-asset:
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/')
    # 确保写入公共仓库的权限
    permissions:
      contents: write 
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
    
    - name: Install dependencies
      run: yarn install --frozen-lockfile
    
    - name: Build application
      id: build
      run: |
        if [ "${{ matrix.os }}" == "macos-latest" ]; then
          yarn build:mac --universal
        else
          yarn build:win
        fi
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}

    # 替换上传 Artifact 的步骤：直接上传到 Release Asset
    - name: Upload Release Asset to Public Repo
      uses: softprops/action-gh-release@v2
      with:
        # 使用具有公共仓库写入权限的 Token
        token: ${{ secrets.GH_TOKEN }} 
        # 指定目标公共仓库
        repository: sun-guannan/CapCutMaker 
        # **重要：** 必须指定要上传的文件。
        files: |
          build/*.zip
          build/*.dmg
          build/*.exe
          build/latest*.yml
        
        # 使用 upload_assets_only: true 意味着它不会尝试创建新的 Release，
        # 它只会将文件附加到现有的 Tag/Release 上。
        upload_assets_only: true
        tag_name: ${{ github.ref }} # 使用当前 Tag 名称附加文件
  
  # 任务 3: 确保所有构建完成后，仅用于依赖管理和后续流程（例如通知）。
  # **此任务不再下载或上传任何大文件，它只是一个流程的终点。**
  release-complete:
    runs-on: ubuntu-latest
    if: always() # 即使 Job 2 失败，也要记录完成情况
    needs: [build-and-release-asset] # 依赖所有构建任务
    steps:
      - name: Release Process Finished
        run: echo "All assets for ${{ github.ref }} should now be uploaded to CapCutMaker Release."

