name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:

  # 任务 2A: macOS 构建并上传 macOS 资产到 OSS
  # 注意：保留 Job 名称以避免影响外部状态检查配置
  build-and-upload-mac:
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      matrix:
        node-version: [22.x]
        channel_brand: [default, bingo]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare bundled ffmpeg (macOS)
        run: pnpm run prepare:portable-ffmpeg:mac
        shell: bash

      - name: Import macOS signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Prepare macOS signing environment
        shell: bash
        run: |
          [ -n "${APPLE_ID:-}" ] || { echo "Missing APPLE_ID secret"; exit 1; }
          [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] || { echo "Missing APPLE_APP_SPECIFIC_PASSWORD secret"; exit 1; }
          [ -n "${APPLE_TEAM_ID:-}" ] || { echo "Missing APPLE_TEAM_ID secret"; exit 1; }
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      
      - name: Build Mac applications (x64 + arm64)
        run: |
          rm -rf build
          pnpm run build:vite
          pnpm run prepare:portable-ffmpeg:mac
          pnpm exec electron-builder --config electron-builder.config.cjs --mac dmg zip --x64 --arm64 --publish never --config.mac.forceCodeSigning=true
        shell: bash
        env:
          CHANNEL_BRAND: ${{ matrix.channel_brand }}
          NODE_OPTIONS: --max-old-space-size=8192
          DEBUG: electron-builder
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FEEDBACK_SMTP_HOST: ${{ secrets.FEEDBACK_SMTP_HOST }}
          FEEDBACK_SMTP_PORT: ${{ secrets.FEEDBACK_SMTP_PORT }}
          FEEDBACK_SMTP_USER: ${{ secrets.FEEDBACK_SMTP_USER }}
          FEEDBACK_SMTP_PASS: ${{ secrets.FEEDBACK_SMTP_PASS }}
          FEEDBACK_TO_EMAIL: ${{ secrets.FEEDBACK_TO_EMAIL }}

      - name: Sign and notarize macOS artifacts
        timeout-minutes: 80
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          PROPAGATION_SLEEP_SECONDS=69
          STAPLE_RETRY_SLEEP_SECONDS=69
          NOTARY_SUBMIT_MAX_ATTEMPTS=5
          NOTARY_SUBMIT_RETRY_SLEEP_SECONDS=45
          DEVELOPER_ID_APP_IDENTITY=$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)
          if [ -z "${DEVELOPER_ID_APP_IDENTITY:-}" ]; then
            echo "No Developer ID Application identity found in keychain."
            security find-identity -v -p codesigning || true
            exit 1
          fi
          echo "Using codesign identity for DMG container: ${DEVELOPER_ID_APP_IDENTITY}"
          shopt -s nullglob
          DMGS=(build/*.dmg)
          if [ "${#DMGS[@]}" -eq 0 ]; then
            echo "No .dmg artifacts found in build directory."
            find build -maxdepth 3 -print
            exit 1
          fi

          for DMG_PATH in "${DMGS[@]}"; do
            echo "===== Processing DMG: $DMG_PATH ====="
            echo "Signing DMG container before notarization: $DMG_PATH"
            codesign --force --sign "$DEVELOPER_ID_APP_IDENTITY" --timestamp --verbose "$DMG_PATH"
            echo "===== DMG container sign info ====="
            codesign -dv --verbose=4 "$DMG_PATH" 2>&1
            echo "Submitting DMG to Apple notary service: $DMG_PATH"
            SUBMISSION_ACCEPTED=0
            SUB_ID=""
            SUB_STATUS=""

            for attempt in $(seq 1 "$NOTARY_SUBMIT_MAX_ATTEMPTS"); do
              echo "Notary submit attempt $attempt/$NOTARY_SUBMIT_MAX_ATTEMPTS for $DMG_PATH"
              if NOTARY_JSON=$(xcrun notarytool submit "$DMG_PATH" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --wait --output-format json 2>&1); then
                echo "$NOTARY_JSON"

                SUB_ID=$(echo "$NOTARY_JSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))")
                SUB_STATUS=$(echo "$NOTARY_JSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status',''))")

                if [ "$SUB_STATUS" = "Accepted" ]; then
                  SUBMISSION_ACCEPTED=1
                  break
                fi

                echo "Notarization status: $SUB_STATUS (submission id: ${SUB_ID:-N/A})"
                if [ -n "$SUB_ID" ]; then
                  xcrun notarytool log "$SUB_ID" \
                    --apple-id "$APPLE_ID" \
                    --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                    --team-id "$APPLE_TEAM_ID" || true
                fi
              else
                echo "$NOTARY_JSON"
                if echo "$NOTARY_JSON" | grep -qiE "The operation was canceled|timed out|timeout|temporarily unavailable|network|connection"; then
                  echo "Transient notary submit failure detected, will retry."
                else
                  echo "Non-retryable notary submit error."
                  exit 1
                fi
              fi

              if [ "$attempt" -lt "$NOTARY_SUBMIT_MAX_ATTEMPTS" ]; then
                echo "Waiting ${NOTARY_SUBMIT_RETRY_SLEEP_SECONDS}s before retry..."
                sleep "$NOTARY_SUBMIT_RETRY_SLEEP_SECONDS"
              fi
            done

            if [ "$SUBMISSION_ACCEPTED" -ne 1 ]; then
              echo "Notarization submit failed after $NOTARY_SUBMIT_MAX_ATTEMPTS attempts for $DMG_PATH."
              exit 1
            fi

            echo "Waiting for notarization ticket propagation..."
            sleep "$PROPAGATION_SLEEP_SECONDS"

            STAPLE_OK=0
            for attempt in 1 2 3 4 5; do
              echo "Staple attempt $attempt for $DMG_PATH..."
              if xcrun stapler staple "$DMG_PATH"; then
                STAPLE_OK=1
                break
              fi
              sleep "$STAPLE_RETRY_SLEEP_SECONDS"
            done

            if [ "$STAPLE_OK" -ne 1 ]; then
              echo "The staple action failed after retries for $DMG_PATH."
              exit 65
            fi
          done

      - name: Prepare latest macOS artifacts and metadata
        shell: bash
        env:
          CHANNEL_BRAND: ${{ matrix.channel_brand }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          VERSION=$(node -p "require('./package.json').version")
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          LATEST_PREFIX="VectCut"
          if [ "${CHANNEL_BRAND}" = "bingo" ]; then
            LATEST_PREFIX="BingoCut"
          fi

          X64_ZIPS=(build/*-x64.zip)
          ARM64_ZIPS=(build/*-arm64.zip)
          if [ "${#X64_ZIPS[@]}" -eq 0 ] || [ "${#ARM64_ZIPS[@]}" -eq 0 ]; then
            echo "Missing x64/arm64 zip artifacts for latest metadata generation."
            ls -lah build || true
            exit 1
          fi

          X64_ZIP="${X64_ZIPS[0]}"
          ARM64_ZIP="${ARM64_ZIPS[0]}"
          X64_DMGS=(build/*-x64.dmg)
          ARM64_DMGS=(build/*-arm64.dmg)
          if [ "${#X64_DMGS[@]}" -eq 0 ] || [ "${#ARM64_DMGS[@]}" -eq 0 ]; then
            echo "Missing x64/arm64 dmg artifacts for latest filename generation."
            ls -lah build || true
            exit 1
          fi

          X64_DMG="${X64_DMGS[0]}"
          ARM64_DMG="${ARM64_DMGS[0]}"
          cp "$X64_ZIP" "build/${LATEST_PREFIX}-latest-x64.zip"
          cp "$ARM64_ZIP" "build/${LATEST_PREFIX}-latest-arm64.zip"
          cp "$X64_DMG" "build/${LATEST_PREFIX}-latest-x64.dmg"
          cp "$ARM64_DMG" "build/${LATEST_PREFIX}-latest-arm64.dmg"

          X64_SHA512=$(openssl dgst -sha512 -binary "build/${LATEST_PREFIX}-latest-x64.zip" | openssl base64 -A)
          ARM64_SHA512=$(openssl dgst -sha512 -binary "build/${LATEST_PREFIX}-latest-arm64.zip" | openssl base64 -A)
          X64_SIZE=$(stat -f%z "build/${LATEST_PREFIX}-latest-x64.zip")
          ARM64_SIZE=$(stat -f%z "build/${LATEST_PREFIX}-latest-arm64.zip")

          cat > build/latest-mac.yml <<EOF
          version: ${VERSION}
          files:
            - url: ${LATEST_PREFIX}-latest-x64.zip
              sha512: ${X64_SHA512}
              size: ${X64_SIZE}
          path: ${LATEST_PREFIX}-latest-x64.zip
          sha512: ${X64_SHA512}
          releaseDate: '${RELEASE_DATE}'
          EOF

          cat > build/latest-mac-arm64.yml <<EOF
          version: ${VERSION}
          files:
            - url: ${LATEST_PREFIX}-latest-arm64.zip
              sha512: ${ARM64_SHA512}
              size: ${ARM64_SIZE}
          path: ${LATEST_PREFIX}-latest-arm64.zip
          sha512: ${ARM64_SHA512}
          releaseDate: '${RELEASE_DATE}'
          EOF

      - name: Upload mac signing diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-signing-diagnostics-${{ matrix.channel_brand }}-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            build/builder-debug.yml
            build/builder-effective-config.yaml
            build/latest-mac.yml
            build/latest-mac-arm64.yml

      - name: Install ossutil
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/1.7.16/ossutilmac64 -o ossutil
          chmod +x ossutil
          sudo mv ossutil /usr/local/bin/ossutil
          ossutil --version

      - name: Deploy macOS Assets to OSS (Latest Path)
        env:
          CHANNEL_BRAND: ${{ matrix.channel_brand }}
          MP4_OSS_ENDPOINT: ${{ secrets.MP4_OSS_ENDPOINT }}
          MP4_OSS_ACCESS_KEY_ID: ${{ secrets.MP4_OSS_ACCESS_KEY_ID }}
          MP4_OSS_ACCESS_KEY_SECRET: ${{ secrets.MP4_OSS_ACCESS_KEY_SECRET }}
          MP4_OSS_BUCKET_NAME: ${{ secrets.MP4_OSS_BUCKET_NAME }}
        run: |
          ossutil config -e "${MP4_OSS_ENDPOINT}" -i "${MP4_OSS_ACCESS_KEY_ID}" -k "${MP4_OSS_ACCESS_KEY_SECRET}" -L CH -c /tmp/.ossutilconfig
          LATEST_PREFIX="VectCut"
          DEST="oss://${MP4_OSS_BUCKET_NAME}/client/latest/"
          if [ "${CHANNEL_BRAND}" = "bingo" ]; then
            LATEST_PREFIX="BingoCut"
            DEST="oss://${MP4_OSS_BUCKET_NAME}/client/latest/bingo/"
          fi
          FILES=(
            build/${LATEST_PREFIX}-latest-x64.zip
            build/${LATEST_PREFIX}-latest-arm64.zip
            build/${LATEST_PREFIX}-latest-x64.dmg
            build/${LATEST_PREFIX}-latest-arm64.dmg
            build/latest-mac.yml
            build/latest-mac-arm64.yml
          )
          for f in "${FILES[@]}"; do
            [ -f "$f" ] || { echo "Missing mac artifact: $f"; exit 1; }
            echo "Uploading $f to $DEST"
            ossutil cp -f "$f" "$DEST" -c /tmp/.ossutilconfig
          done

  # 任务 2B: Windows 构建并上传 Windows 资产到 OSS
  # 注意：保留 Job 名称以避免影响外部状态检查配置
  build-and-upload-win:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [22.x]
        channel_brand: [default, bingo]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare bundled ffmpeg (Windows)
        shell: bash
        run: pnpm run prepare:portable-ffmpeg:win

      - name: Rebuild Electron native dependencies (Windows)
        shell: bash
        run: pnpm exec electron-builder install-app-deps

      - name: Validate native bindings before packaging
        shell: bash
        run: |
          set -euo pipefail
          NODE_COUNT=$(find node_modules -type f -name "*.node" | wc -l | tr -d ' ')
          echo "Detected native .node files: ${NODE_COUNT}"
          if [ "${NODE_COUNT}" -eq 0 ]; then
            echo "No native bindings found in node_modules; aborting Windows package build."
            exit 1
          fi
          LIBSQL_BINDING="node_modules/@libsql/win32-x64-msvc/index.node"
          if [ ! -f "${LIBSQL_BINDING}" ]; then
            echo "Missing required libsql native binding: ${LIBSQL_BINDING}"
            exit 1
          fi

      - name: Download VC++ Redistributable (Windows)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-resources/windows
          curl -fsSL "https://aka.ms/vs/17/release/vc_redist.x64.exe" -o build-resources/windows/vc_redist.x64.exe
          test -s build-resources/windows/vc_redist.x64.exe
      
      - name: Build Windows application
        run: pnpm run build:win
        shell: bash
        env:
          CHANNEL_BRAND: ${{ matrix.channel_brand }}
          NODE_OPTIONS: --max-old-space-size=8192
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          FEEDBACK_SMTP_HOST: ${{ secrets.FEEDBACK_SMTP_HOST }}
          FEEDBACK_SMTP_PORT: ${{ secrets.FEEDBACK_SMTP_PORT }}
          FEEDBACK_SMTP_USER: ${{ secrets.FEEDBACK_SMTP_USER }}
          FEEDBACK_SMTP_PASS: ${{ secrets.FEEDBACK_SMTP_PASS }}
          FEEDBACK_TO_EMAIL: ${{ secrets.FEEDBACK_TO_EMAIL }}

      - name: Download EVSign CLI
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://down.evsign.cn/software/evsign-client-cli-win_v1.0.1.exe" -OutFile "SignClient.exe"

      - name: Sign Windows installer
        shell: powershell
        env:
          EVSIGN_LICENSE: ${{ secrets.EVSIGN_LICENSE }}
        run: |
          $exe = Get-ChildItem -Path "build" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No Windows installer (.exe) found in build directory." }
          .\SignClient.exe "$($exe.FullName)" -key "$env:EVSIGN_LICENSE" -sha256
          $signExit = $LASTEXITCODE
          Write-Host "EVSign exit code: $signExit"

          $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
          Write-Host "Signature status after EVSign: $($sig.Status)"
          if ($sig.SignerCertificate) {
            Write-Host "Signer subject: $($sig.SignerCertificate.Subject)"
          }

          if ($sig.Status -ne 'Valid') {
            throw "Signature verification failed immediately after EVSign: $($sig.Status), EVSign exit code: $signExit"
          }

          if ($signExit -ne 0) {
            Write-Warning "EVSign exited with code $signExit, but Authenticode signature is valid."
          }

      - name: Verify signature
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path "build" -Filter "*.exe" | Select-Object -First 1
          $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
          if ($sig.Status -ne 'Valid') { throw "Signature verification failed: $($sig.Status)" }
          Write-Host "Signed file: $($exe.Name)"

      - name: Install ossutil (Windows)
        shell: bash
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/1.7.16/ossutil64.exe -o ossutil64.exe
          chmod +x ossutil64.exe
          ./ossutil64.exe --version

      - name: Deploy Windows Assets to OSS (Latest Path)
        shell: bash
        env:
          CHANNEL_BRAND: ${{ matrix.channel_brand }}
          MP4_OSS_ENDPOINT: ${{ secrets.MP4_OSS_ENDPOINT }}
          MP4_OSS_ACCESS_KEY_ID: ${{ secrets.MP4_OSS_ACCESS_KEY_ID }}
          MP4_OSS_ACCESS_KEY_SECRET: ${{ secrets.MP4_OSS_ACCESS_KEY_SECRET }}
          MP4_OSS_BUCKET_NAME: ${{ secrets.MP4_OSS_BUCKET_NAME }}
        run: |
          WIN_EXE=$(ls build/*.exe | head -n 1)
          LATEST_SETUP_NAME="VectCut-Setup-latest-x64.exe"
          DEST="oss://${MP4_OSS_BUCKET_NAME}/client/latest/"
          if [ "${CHANNEL_BRAND}" = "bingo" ]; then
            LATEST_SETUP_NAME="BingoCut-Setup-latest-x64.exe"
            DEST="oss://${MP4_OSS_BUCKET_NAME}/client/latest/bingo/"
          fi
          cp "$WIN_EXE" "build/${LATEST_SETUP_NAME}"
          VERSION=$(node -p "require('./package.json').version")
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          WIN_SHA512=$(openssl dgst -sha512 -binary "build/${LATEST_SETUP_NAME}" | openssl base64 -A)
          WIN_SIZE=$(stat -c%s "build/${LATEST_SETUP_NAME}")
          cat > build/latest.yml <<EOF
          version: ${VERSION}
          files:
            - url: ${LATEST_SETUP_NAME}
              sha512: ${WIN_SHA512}
              size: ${WIN_SIZE}
          path: ${LATEST_SETUP_NAME}
          sha512: ${WIN_SHA512}
          releaseDate: '${RELEASE_DATE}'
          EOF
          ./ossutil64.exe config -e "${MP4_OSS_ENDPOINT}" -i "${MP4_OSS_ACCESS_KEY_ID}" -k "${MP4_OSS_ACCESS_KEY_SECRET}" -L CH -c /tmp/.ossutilconfig
          ./ossutil64.exe cp -f "build/${LATEST_SETUP_NAME}" "${DEST}" -c /tmp/.ossutilconfig
          ./ossutil64.exe cp -f build/latest.yml "${DEST}latest.yml" -c /tmp/.ossutilconfig

  refresh-dcdn:
    runs-on: ubuntu-latest
    needs:
      - build-and-upload-mac
      - build-and-upload-win
    timeout-minutes: 15
    steps:
      - name: Install Alibaba Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o aliyun-cli.tgz
          tar -xzf aliyun-cli.tgz
          sudo mv aliyun /usr/local/bin/aliyun
          aliyun version

      - name: Configure Alibaba Cloud CLI
        shell: bash
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.MP4_OSS_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.MP4_OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          [ -n "${ALIBABA_CLOUD_ACCESS_KEY_ID:-}" ] || { echo "Missing AccessKey ID"; exit 1; }
          [ -n "${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}" ] || { echo "Missing AccessKey Secret"; exit 1; }
          aliyun configure set \
            --mode AK \
            --access-key-id "${ALIBABA_CLOUD_ACCESS_KEY_ID}" \
            --access-key-secret "${ALIBABA_CLOUD_ACCESS_KEY_SECRET}" \
            --region cn-hangzhou

      - name: Refresh and preload DCDN caches
        shell: bash
        run: |
          set -euo pipefail

          refresh_urls=$(cat <<'EOF'
          https://player.install-ai-guider.top/client/latest/latest.yml
          https://player.install-ai-guider.top/client/latest/latest-mac.yml
          https://player.install-ai-guider.top/client/latest/latest-mac-arm64.yml
          https://player.install-ai-guider.top/client/latest/VectCut-latest-x64.dmg
          https://player.install-ai-guider.top/client/latest/VectCut-latest-arm64.dmg
          https://player.install-ai-guider.top/client/latest/VectCut-latest-universal.dmg
          https://player.install-ai-guider.top/client/latest/VectCut-Setup-latest-x64.exe
          https://player.install-ai-guider.top/client/latest/VectCut-latest-x64.zip
          https://player.install-ai-guider.top/client/latest/VectCut-latest-arm64.zip
          https://player.install-ai-guider.top/client/latest/VectCut-latest-universal.zip
          https://player.install-ai-guider.top/client/latest/bingo/latest.yml
          https://player.install-ai-guider.top/client/latest/bingo/latest-mac.yml
          https://player.install-ai-guider.top/client/latest/bingo/latest-mac-arm64.yml
          https://player.install-ai-guider.top/client/latest/bingo/BingoCut-latest-x64.dmg
          https://player.install-ai-guider.top/client/latest/bingo/BingoCut-latest-arm64.dmg
          https://player.install-ai-guider.top/client/latest/bingo/BingoCut-Setup-latest-x64.exe
          https://player.install-ai-guider.top/client/latest/bingo/BingoCut-latest-x64.zip
          https://player.install-ai-guider.top/client/latest/bingo/BingoCut-latest-arm64.zip
          EOF
          )

          preload_urls=$(cat <<'EOF'
          https://player.install-ai-guider.top/client/latest/VectCut-latest-x64.dmg
          https://player.install-ai-guider.top/client/latest/VectCut-latest-arm64.dmg
          https://player.install-ai-guider.top/client/latest/VectCut-latest-universal.dmg
          https://player.install-ai-guider.top/client/latest/VectCut-Setup-latest-x64.exe
          https://player.install-ai-guider.top/client/latest/VectCut-latest-x64.zip
          https://player.install-ai-guider.top/client/latest/VectCut-latest-arm64.zip
          https://player.install-ai-guider.top/client/latest/VectCut-latest-universal.zip
          https://player.install-ai-guider.top/client/latest/bingo/BingoCut-latest-x64.dmg
          https://player.install-ai-guider.top/client/latest/bingo/BingoCut-latest-arm64.dmg
          https://player.install-ai-guider.top/client/latest/bingo/BingoCut-Setup-latest-x64.exe
          https://player.install-ai-guider.top/client/latest/bingo/BingoCut-latest-x64.zip
          https://player.install-ai-guider.top/client/latest/bingo/BingoCut-latest-arm64.zip
          EOF
          )

          retry() {
            local max_attempts="$1"
            shift
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed, retrying in 10s..."
              attempt=$((attempt + 1))
              sleep 10
            done
          }

          echo "Refreshing DCDN URLs..."
          retry 3 aliyun dcdn RefreshDcdnObjectCaches \
            --ObjectPath "${refresh_urls}" \
            --ObjectType File

          echo "Preloading DCDN URLs..."
          retry 3 aliyun dcdn PreloadDcdnObjectCaches \
            --ObjectPath "${preload_urls}"
